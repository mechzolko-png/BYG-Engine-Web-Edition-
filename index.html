<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LAUNCH </title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: calc(20px);
            background-image: url(icons/blada.jfif);
            background-position: center;
            background-size: cover;
        }

        .btn {
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: xx-large;
            padding: 50px;
            background-color: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border: solid 2px rgba(255, 255, 255, 0.13);
            border-radius: 10px;
            box-shadow: 5px 5px 5px 2px rgba(0, 0, 0, 0.7);
            transition: all 0.3s;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
        }

        .btn:hover {
            transform: translateY(-20px)
            scale(1.03);
            box-shadow: 5px 10px 8px 2px rgba(0, 0, 0, 0.7);
            transition: all 0.3s;
        }

    </style>
</head>
<body>
    
    <div class="btn" onclick="startGame()">Start game</div>
    <div class="btn" onclick="startEngine()">Start engine</div>

    <script>
    function startEngine() {
        window.location.href = "/ENTRY/engineLook.html";
    }

    function startGame() {
        window.location.href = "/ENTRY/gameLook.html";
    }
    </script>

</body>
</html>
